[project]
name = "corridor"
version = "0.1.0"
description = "Friendly EW / drone corridor deconfliction, published to TAK clients through OpenTAKServer."
readme = "README.md"
authors = [
    { name = "Yoann CORGNET" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
corridor-tak = "corridor.tak.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["corridor"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
